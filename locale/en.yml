ernestdefoe-lectern:
  admin:
    enabled_label: Show PDFs in posts
    enabled_help: Adds a View button to PDF files in posts. Turn it off to leave every PDF as a normal link.
    mode_label: Open PDFs
    mode_help: Full screen covers the page. In the post opens the viewer under the file. Phones always get full screen.
    mode:
      modal: Full screen
      inline: In the post
    permission: View PDFs in posts
    fof_upload_help: "With FoF Upload, PDFs work out of the box: their download buttons get a View button. For a card with the file name and size, open FoF Upload's settings and use the PDF viewer template for application/pdf."
    template:
      name: PDF viewer (Lectern)
      description: Shows the PDF as a card with its name and size, a View button that opens it in the post, and a download button.

  forum:
    view: View
    view_file: "View {name}"
